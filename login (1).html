<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login | MY DRYBEA</title>
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-primary:#040d0a; --bg-card:#0d1e18; --bg-elevated:#18352b;
  --border-strong:rgba(16,185,129,0.3);
  --text-main:#f0fdf4; --text-secondary:#d1fae5; --text-muted:#6ee7b7;
  --green:#10b981; --green-deep:#059669; --lime-accent:#a3e635;
  --bad:#f87171; --bad-bg:rgba(248,113,113,0.12);
  --gold:#d4af37; --gold-light:#f5e7a3;
  --radius:16px; --radius-sm:10px;
  --font:'Inter','Noto Sans Sinhala',sans-serif;
  --font-display:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg-primary); color:var(--text-main); font-family:var(--font);
  min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.card{
  width:100%; max-width:380px;
  background:linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
  border:1.5px solid var(--border-strong); border-radius:var(--radius);
  box-shadow:0 20px 60px rgba(0,0,0,0.6); padding:34px 28px;
}
.logo{ width:64px; height:64px; margin:0 auto 12px; display:block; border-radius:16px;
  border:2px solid var(--gold); object-fit:cover; }
h1{
  text-align:center; font-family:var(--font-display); font-weight:900; font-size:1.5rem;
  color:var(--green); letter-spacing:0.04em; margin-bottom:2px;
}
p.sub{ text-align:center; color:var(--text-muted); font-size:12px; margin-bottom:24px; text-transform:uppercase; letter-spacing:0.08em; }
label{ display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:6px; font-weight:600; }
input{
  width:100%; background:rgba(4,13,10,0.5); border:1.5px solid rgba(16,185,129,0.2);
  border-radius:var(--radius-sm); padding:12px 14px; color:var(--text-main);
  font-family:var(--font); font-size:14.5px; margin-bottom:16px;
}
input:focus{ outline:none; border-color:var(--green); }
button{
  width:100%; padding:13px; border:none; border-radius:var(--radius-sm);
  background:linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
  color:#04120c; font-weight:800; font-size:14.5px; cursor:pointer;
}
button:disabled{ opacity:0.6; cursor:not-allowed; }
.error{
  display:none; background:var(--bad-bg); border:1px solid rgba(248,113,113,0.35);
  color:#fecaca; padding:10px 12px; border-radius:var(--radius-sm); font-size:12.5px;
  margin-bottom:14px;
}
.error.show{ display:block; }
.footer{ text-align:center; margin-top:18px; font-size:11px; color:var(--text-muted); opacity:0.7; }
</style>
</head>
<body>

<div class="card">
  <img src="logo.jpg" class="logo" alt="MY DRYBEA" onerror="this.src='https://kommodo.ai/i/7zQwNJ1aSv6KnXu59Okw'">
  <h1>MY DRYBEA</h1>
  <p class="sub">Enterprise Login</p>

  <div class="error" id="errBox"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="loginBtn">🔐 Login</button>
  </form>

  <div class="footer">© <span id="year"></span> MY DRYBEA — Authorized Access Only</div>
</div>

<script>
const SUPABASE_URL = 'https://dztuyfiiyxllnvciunjv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6dHV5ZmlpeXhsbG52Y2l1bmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDg3NjUsImV4cCI6MjEwMzU4NDc2NX0.NT5_fvlwZZr_MQMgerYaIZYHeeJ9l9SrConqcN50M84';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
$('year').textContent = new Date().getFullYear();

// Already logged in? Skip straight to the app.
supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.replace('index.html');
});

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('errBox').classList.remove('show');
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Checking…';

  const email = $('email').value.trim();
  const password = $('password').value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    $('errBox').textContent = error.message;
    $('errBox').classList.add('show');
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = '🔐 Login';
  } else {
    window.location.replace('index.html');
  }
});
</script>

</body>
</html>
