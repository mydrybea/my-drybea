<!DOCTYPE html>
<html lang="si" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY DRYBEA — Notification Center v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — lifted straight from MY DRYBEA's existing style.css
   ============================================================ */
:root{
  --bg-primary:#040d0a; --bg-secondary:#0a1712; --bg-card:#0d1e18;
  --bg-card-hover:#132a22; --bg-elevated:#18352b;
  --border:rgba(16,185,129,0.15); --border-strong:rgba(16,185,129,0.3);
  --text-main:#f0fdf4; --text-secondary:#d1fae5; --text-muted:#6ee7b7; --text-dim:#4ade80;
  --green:#10b981; --green-deep:#059669; --green-dark:#047857;
  --green-glow:rgba(16,185,129,0.3); --green-subtle:rgba(16,185,129,0.08);
  --lime-accent:#a3e635;
  --bad:#f87171; --bad-bg:rgba(248,113,113,0.12);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,0.12);
  --gold:#d4af37; --gold-light:#f5e7a3; --gold-dark:#a8842c; --gold-glow:rgba(212,175,55,0.35);
  --radius:16px; --radius-sm:10px; --radius-xs:6px;
  --font:'Inter',-apple-system,sans-serif; --font-display:'Playfair Display',Georgia,serif;
  --shadow-lg:0 20px 60px rgba(0,0,0,0.7);
  --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#000; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:var(--font); padding:24px;
}

/* ============================================================
   NOTIFICATION CENTER — v2
   ============================================================ */
.nc-panel{
  width:100%; max-width:400px; max-height:88vh;
  background:linear-gradient(165deg, var(--bg-card) 0%, #081410 100%);
  border:1px solid var(--border-strong);
  border-radius:22px;
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.02) inset;
  overflow:hidden;
  display:flex; flex-direction:column;
  position:relative;
  animation:panelIn .38s cubic-bezier(.22,1,.36,1);
}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* thin living gradient seam at the very top edge — the one signature flourish */
.nc-panel::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent, var(--gold), var(--lime-accent), var(--gold), transparent);
  background-size:200% 100%; animation:seam 5s linear infinite; opacity:.8;
}
@keyframes seam{0%{background-position:0% 0}100%{background-position:200% 0}}

/* ---- header ---- */
.nc-head{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  background:radial-gradient(ellipse at 20% 0%, rgba(16,185,129,.10), transparent 60%);
}
.nc-head-top{display:flex; align-items:center; gap:12px;}
.nc-bell{
  flex:0 0 auto; width:40px; height:40px; border-radius:13px;
  display:grid; place-items:center;
  background:linear-gradient(145deg, var(--green-subtle), rgba(163,230,53,.06));
  border:1px solid var(--border-strong);
  color:var(--green); position:relative;
}
.nc-bell svg{width:19px; height:19px;}
.nc-bell .ring-dot{
  position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
  background:var(--bad); box-shadow:0 0 0 3px var(--bg-card);
  animation:ringPulse 1.8s ease-in-out infinite;
}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 3px var(--bg-card),0 0 0 3px rgba(248,113,113,.5)}50%{box-shadow:0 0 0 3px var(--bg-card),0 0 0 7px rgba(248,113,113,0)}}
.nc-head-title{flex:1; min-width:0;}
.nc-head-title h2{
  font-family:var(--font-display); font-weight:700; font-style:italic;
  font-size:1.22rem; color:var(--text-main); letter-spacing:.01em; line-height:1.1;
}
.nc-head-title p{font-size:.72rem; color:var(--text-muted); margin-top:3px; font-weight:500;}
.nc-close-x{
  flex:0 0 auto; width:30px; height:30px; border-radius:10px; border:1px solid var(--border);
  background:transparent; color:var(--text-muted); display:grid; place-items:center; cursor:pointer;
  transition:var(--transition);
}
.nc-close-x:hover{background:var(--bg-card-hover); color:var(--text-main); border-color:var(--border-strong);}

.nc-head-bottom{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px;}
.nc-sound{
  display:flex; align-items:center; gap:7px;
  padding:6px 12px 6px 10px; border-radius:999px;
  border:1px solid var(--border-strong); background:var(--green-subtle); color:var(--green);
  font-size:.7rem; font-weight:700; cursor:pointer; transition:var(--transition);
}
.nc-sound:hover{background:var(--green-glow); border-color:var(--green);}
.nc-sound svg{width:13px; height:13px;}
.nc-mark-all{
  font-size:.68rem; font-weight:700; color:var(--text-muted); background:none; border:none; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--border-strong);
  transition:var(--transition);
}
.nc-mark-all:hover{color:var(--lime-accent);}

/* ---- list ---- */
.nc-body{overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; flex:1;}
.nc-body::-webkit-scrollbar{width:5px;}
.nc-body::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:10px;}

.nc-day-label{
  font-size:.63rem; font-weight:700; color:var(--text-dim); text-transform:uppercase;
  letter-spacing:.08em; padding:2px 2px 2px; opacity:.75;
}

/* ---- generic notification card ---- */
.nc-card{
  border-radius:16px; border:1px solid var(--border); background:var(--bg-secondary);
  padding:13px 14px; position:relative; transition:var(--transition);
  animation:itemIn .3s ease backwards;
}
.nc-card:hover{border-color:var(--border-strong); background:var(--bg-card-hover);}
.nc-card.unread{border-color:rgba(16,185,129,.35); background:linear-gradient(145deg, var(--green-subtle), var(--bg-secondary) 60%);}
.nc-card.unread::after{
  content:''; position:absolute; top:14px; left:-1px; width:3px; height:calc(100% - 28px);
  background:linear-gradient(var(--lime-accent), var(--green)); border-radius:0 3px 3px 0;
}
@keyframes itemIn{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:translateY(0)}}

.nc-card-top{display:flex; align-items:flex-start; gap:10px;}
.nc-icon{
  flex:0 0 auto; width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  background:var(--green-subtle); color:var(--green); font-size:1rem;
}
.nc-card.type-order .nc-icon{background:linear-gradient(145deg, rgba(212,175,55,.16), rgba(212,175,55,.05)); color:var(--gold);}
.nc-card.type-info .nc-icon{background:rgba(110,231,183,.10); color:var(--text-muted);}

.nc-card-head{flex:1; min-width:0; display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.nc-card-head-text{min-width:0;}
.nc-title{font-weight:700; font-size:.84rem; color:var(--text-main); line-height:1.3;}
.nc-sub{font-size:.68rem; color:var(--text-muted); margin-top:2px;}
.nc-time{font-size:.63rem; color:var(--text-dim); white-space:nowrap; flex:0 0 auto; padding-top:1px;}

.nc-status{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:.6rem; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
  flex:0 0 auto;
}
.nc-status::before{content:''; width:5px; height:5px; border-radius:50%; background:currentColor;}
.nc-status.pending{background:var(--warn-bg); color:var(--warn);}
.nc-status.confirmed{background:var(--green-subtle); color:var(--green);}
.nc-status.cancelled{background:var(--bad-bg); color:var(--bad);}

/* ---- order detail grid ---- */
.nc-order-body{margin-top:11px; padding-top:11px; border-top:1px dashed var(--border);}
.nc-order-item{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px;}
.nc-order-item .name{font-size:.78rem; color:var(--text-secondary); font-weight:600;}
.nc-order-item .qty{font-size:.66rem; color:var(--text-muted); margin-top:1px;}
.nc-order-item .price{font-size:.84rem; font-weight:800; color:var(--text-main); white-space:nowrap;}

.nc-meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-top:2px;}
.nc-meta{min-width:0;}
.nc-meta .k{font-size:.6rem; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
.nc-meta .v{font-size:.75rem; color:var(--text-secondary); font-weight:600; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.nc-total-row{
  display:flex; align-items:center; justify-content:space-between; margin-top:11px; padding-top:11px;
  border-top:1px solid var(--border);
}
.nc-total-row .label{font-size:.68rem; color:var(--text-muted); font-weight:700;}
.nc-total-row .amount{font-family:var(--font-display); font-size:1.15rem; font-weight:700; color:var(--gold-light); font-style:italic;}

.nc-note{
  margin-top:10px; font-size:.68rem; color:var(--text-dim); font-style:italic;
  display:flex; align-items:center; gap:6px;
}

/* ---- simple/info card ---- */
.nc-card.type-info .nc-msg{font-size:.76rem; color:var(--text-secondary); margin-top:3px; line-height:1.45;}

/* ---- footer ---- */
.nc-foot{padding:14px 16px; border-top:1px solid var(--border); background:var(--bg-secondary);}
.nc-close-btn{
  width:100%; padding:12px; border-radius:13px; border:1px solid var(--border-strong);
  background:transparent; color:var(--text-secondary); font-weight:700; font-size:.84rem;
  font-family:var(--font); cursor:pointer; transition:var(--transition);
}
.nc-close-btn:hover{background:var(--bg-card-hover); border-color:var(--green); color:var(--text-main);}

/* ---- empty state ---- */
.nc-empty{display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:50px 20px; color:var(--text-muted);}
.nc-empty svg{width:38px; height:38px; opacity:.4;}
.nc-empty p{font-size:.78rem;}
</style>
</head>
<body>

<div class="nc-panel">
  <div class="nc-head">
    <div class="nc-head-top">
      <div class="nc-bell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="ring-dot"></span>
      </div>
      <div class="nc-head-title">
        <h2>Notifications</h2>
        <p>Latest updates for your business, newest first</p>
      </div>
      <button class="nc-close-x" onclick="document.body.style.opacity=1">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="nc-head-bottom">
      <button class="nc-sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        Sound on
      </button>
      <button class="nc-mark-all">Mark all read</button>
    </div>
  </div>

  <div class="nc-body" id="ncBody">
    <div class="nc-day-label">Today</div>
    <!-- cards injected by JS -->
  </div>

  <div class="nc-foot">
    <button class="nc-close-btn" onclick="document.body.style.opacity=1">Close</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// Sample data — same two notifications as the current screenshot,
// still in the raw "*Label:* value" WhatsApp-style text your
// backend already sends. The parser below turns that text into
// the structured card you see above; nothing upstream needs to change.
// ---------------------------------------------------------------
const sampleNotifications = [
  {
    type: 'order',
    unread: true,
    time: '17:42',
    raw: "🔔 ORDER 📦 *MY DRYBEA - INVOICE* *Order ID:* DRY2609-0001 *Date:* 04/09/2026 *Customer:* Daraz Customers *Phone:* 0711171172 *Address:* Daraz.lk *Item:* Umbalakada 100g Pack *Quantity:* 10 *Unit Price:* Rs. 225 *Total:* Rs. 2,250 *Status:* PENDING *Notes:* COD _Thank you for your business! 🙏_"
  },
  {
    type: 'info',
    unread: false,
    time: '17:42',
    title: 'Good morning, team',
    message: 'Good Morning members — 04/09/2026'
  }
];

function parseFields(raw){
  const fields = {};
  const re = /\*([A-Za-z ]+):\*\s*([^*]+?)(?=\s*\*[A-Za-z ]+:\*|_|$)/g;
  let m;
  while ((m = re.exec(raw)) !== null){
    fields[m[1].trim().toLowerCase()] = m[2].trim();
  }
  const noteMatch = raw.match(/_([^_]+)_/);
  if (noteMatch) fields.footer = noteMatch[1].trim();
  return fields;
}

function statusClass(status){
  status = (status || '').toLowerCase();
  if (status.includes('pend')) return 'pending';
  if (status.includes('cancel')) return 'cancelled';
  return 'confirmed';
}

function renderOrderCard(n){
  const f = parseFields(n.raw);
  const status = f.status || 'PENDING';
  return `
    <div class="nc-card type-order ${n.unread ? 'unread' : ''}">
      <div class="nc-card-top">
        <div class="nc-icon">📦</div>
        <div class="nc-card-head">
          <div class="nc-card-head-text">
            <div class="nc-title">New order — ${f['order id'] || ''}</div>
            <div class="nc-sub">${f.customer || 'Customer'} · ${f.phone || ''}</div>
          </div>
          <span class="nc-status ${statusClass(status)}">${status}</span>
        </div>
      </div>
      <div class="nc-order-body">
        <div class="nc-order-item">
          <div>
            <div class="name">${f.item || ''}</div>
            <div class="qty">Qty ${f.quantity || '-'} × ${f['unit price'] || ''}</div>
          </div>
          <div class="price">${f.total || ''}</div>
        </div>
        <div class="nc-meta-grid">
          <div class="nc-meta"><div class="k">Ordered via</div><div class="v">${f.address || '-'}</div></div>
          <div class="nc-meta"><div class="k">Payment</div><div class="v">${f.notes || '-'}</div></div>
        </div>
        <div class="nc-total-row">
          <span class="label">Order total</span>
          <span class="amount">${f.total || ''}</span>
        </div>
        ${f.footer ? `<div class="nc-note">🙏 ${f.footer}</div>` : ''}
      </div>
    </div>`;
}

function renderInfoCard(n){
  return `
    <div class="nc-card type-info ${n.unread ? 'unread' : ''}">
      <div class="nc-card-top">
        <div class="nc-icon">📣</div>
        <div class="nc-card-head">
          <div class="nc-card-head-text">
            <div class="nc-title">${n.title}</div>
            <div class="nc-msg">${n.message}</div>
          </div>
          <span class="nc-time">${n.time}</span>
        </div>
      </div>
    </div>`;
}

const body = document.getElementById('ncBody');
sampleNotifications.forEach((n, i) => {
  const html = n.type === 'order' ? renderOrderCard(n) : renderInfoCard(n);
  body.insertAdjacentHTML('beforeend', html);
});
// stagger the card entrance
document.querySelectorAll('.nc-card').forEach((el, i) => el.style.animationDelay = (i * 0.06) + 's');
</script>
</body>
</html>
