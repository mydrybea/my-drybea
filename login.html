<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login | MY DRYBEA — Enterprise Access Portal</title>
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Sinhala:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#040d0a; --bg-card:#0d1e18; --bg-elevated:#18352b;
  --border:rgba(16,185,129,0.15); --border-strong:rgba(16,185,129,0.3);
  --text-main:#f0fdf4; --text-secondary:#d1fae5; --text-muted:#6ee7b7;
  --green:#10b981; --green-deep:#059669; --lime-accent:#a3e635;
  --bad:#f87171; --bad-bg:rgba(248,113,113,0.12);
  --gold:#d4af37; --gold-light:#f5e7a3; --gold-dark:#a8842c;
  --shadow-lg:0 20px 60px rgba(0,0,0,0.7); --shadow-glow:0 0 40px rgba(16,185,129,0.2);
  --radius:18px; --radius-sm:10px;
  --font:'Inter','Noto Sans Sinhala',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'Playfair Display',Georgia,serif;
  --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg-primary); color:var(--text-main); font-family:var(--font);
  min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:20px; position:relative; overflow-x:hidden; line-height:1.5;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse at 15% 0%, rgba(16,185,129,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 100%, rgba(212,175,55,0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(163,230,53,0.04) 0%, transparent 60%);
}
.portal{
  position:relative; z-index:1; width:100%; max-width:420px;
  background:linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
  border:1.5px solid var(--border-strong); border-radius:var(--radius);
  box-shadow:var(--shadow-lg), var(--shadow-glow);
  padding:38px 32px 30px; overflow:hidden; animation:riseIn 0.5s cubic-bezier(0.4,0,0.2,1);
}
@keyframes riseIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
.portal::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--green) 0%, var(--lime-accent) 25%, var(--gold) 50%, var(--lime-accent) 75%, var(--green) 100%);
  background-size:200% 100%; animation:shimmer 4s linear infinite;
}
@keyframes shimmer{0%{background-position:0% 0%;}100%{background-position:200% 0%;}}

.brand-block{ text-align:center; margin-bottom:26px; }
.logo-wrap{
  width:76px; height:76px; margin:0 auto 14px; position:relative;
}
.logo-wrap img{
  width:100%; height:100%; object-fit:cover; border-radius:18px; display:block;
  border:2px solid var(--gold); box-shadow:0 4px 20px rgba(16,185,129,0.35), 0 0 15px rgba(212,175,55,0.4);
}
.brand-block h1{
  font-family:var(--font-display); font-weight:900; letter-spacing:0.06em;
  font-size:clamp(1.4rem, 5vw, 1.8rem);
  background:linear-gradient(135deg, #93c5fd 0%, #a3e635 25%, #f5e7a3 50%, #10b981 75%, #d4af37 100%);
  background-size:300% 300%; -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; animation:brandShimmer 4s ease-in-out infinite;
}
@keyframes brandShimmer{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.brand-block p{
  color:var(--text-muted); font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
  margin-top:6px; font-weight:600;
}
.portal-tag{
  display:inline-flex; align-items:center; gap:6px; margin-top:14px;
  font-size:11px; color:var(--gold-light); background:rgba(212,175,55,0.1);
  border:1px solid rgba(212,175,55,0.3); padding:5px 12px; border-radius:99px;
  letter-spacing:0.05em;
}

form{ display:flex; flex-direction:column; gap:16px; }
.field label{
  display:block; font-size:12px; font-weight:600; color:var(--text-secondary);
  margin-bottom:7px; letter-spacing:0.03em;
}
.input-wrap{ position:relative; }
.input-wrap .icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  font-size:16px; opacity:0.7; pointer-events:none;
}
.field input{
  width:100%; background:rgba(4,13,10,0.55); border:1.5px solid var(--border);
  border-radius:var(--radius-sm); padding:13px 14px 13px 42px; color:var(--text-main);
  font-family:var(--font); font-size:14.5px; transition:border-color var(--transition), box-shadow var(--transition);
}
.field input:focus{
  outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(16,185,129,0.15);
}
.field input::placeholder{ color:rgba(209,250,229,0.35); }
.toggle-eye{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; font-size:15px; opacity:0.65; padding:4px;
}
.toggle-eye:hover{ opacity:1; }

.row-between{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; margin-top:-4px; }
.remember{ display:flex; align-items:center; gap:7px; color:var(--text-secondary); cursor:pointer; user-select:none; }
.remember input{ accent-color:var(--green); width:14px; height:14px; cursor:pointer; }

.btn-login{
  margin-top:6px; width:100%; padding:14px; border:none; border-radius:var(--radius-sm);
  background:linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
  color:#04120c; font-weight:800; font-size:14.5px; letter-spacing:0.03em; cursor:pointer;
  box-shadow:0 8px 24px rgba(16,185,129,0.35); transition:transform var(--transition), box-shadow var(--transition), opacity var(--transition);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-login:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 10px 30px rgba(16,185,129,0.5); }
.btn-login:active:not(:disabled){ transform:translateY(0); }
.btn-login:disabled{ opacity:0.6; cursor:not-allowed; }

.spinner{
  width:15px; height:15px; border:2.5px solid rgba(4,18,12,0.3); border-top-color:#04120c;
  border-radius:50%; animation:spin 0.7s linear infinite; display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}

.alert{
  display:none; align-items:flex-start; gap:9px; background:var(--bad-bg);
  border:1px solid rgba(248,113,113,0.35); color:#fecaca; padding:11px 13px;
  border-radius:var(--radius-sm); font-size:12.5px; line-height:1.5;
}
.alert.show{ display:flex; animation:shake 0.35s ease; }
@keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }

.divider{ display:flex; align-items:center; gap:10px; margin:6px 0; color:var(--text-muted); font-size:11px; }
.divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--border); }

.footer-note{
  text-align:center; margin-top:22px; font-size:11px; color:var(--text-muted); opacity:0.75;
  display:flex; flex-direction:column; gap:5px; align-items:center;
}
.footer-note .badges{ display:flex; gap:8px; align-items:center; margin-top:2px; }
.footer-note .badges span{
  background:rgba(16,185,129,0.08); border:1px solid var(--border); padding:3px 9px;
  border-radius:99px; font-size:10px; letter-spacing:0.04em; color:var(--text-secondary);
}

.lock-screen{
  position:fixed; inset:0; background:var(--bg-primary); z-index:999; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  transition:opacity 0.4s ease; text-align:center; padding:20px;
}
.lock-screen .big-lock{ font-size:46px; filter:drop-shadow(0 0 20px rgba(16,185,129,0.5)); }
.lock-screen p{ color:var(--text-muted); font-size:13px; letter-spacing:0.06em; }

@media (max-width:420px){ .portal{ padding:30px 22px 24px; } }
</style>
</head>
<body>

<div class="portal">
  <div class="brand-block">
    <div class="logo-wrap">
      <img src="logo.jpg" alt="MY DRYBEA" onerror="this.src='https://kommodo.ai/i/7zQwNJ1aSv6KnXu59Okw'">
    </div>
    <h1>MY DRYBEA</h1>
    <p>Enterprise Umbalakada Management System</p>
    <span class="portal-tag">🔒 Secure Business Access Portal</span>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="email">Business Email</label>
      <div class="input-wrap">
        <span class="icon">✉️</span>
        <input type="email" id="email" placeholder="you@company.com" required autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="icon">🔑</span>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:42px;">
        <button type="button" class="toggle-eye" id="eyeBtn" aria-label="Show password">👁️</button>
      </div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember" checked>
        Keep me signed in
      </label>
      <span style="color:var(--text-muted);">v33 · Encrypted Access</span>
    </div>

    <div class="alert" id="alertBox">
      <span>⚠️</span>
      <span id="alertText">Invalid email or password. Please try again.</span>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      <span class="spinner" id="spinner"></span>
      <span id="loginBtnText">🔐 Access Dashboard</span>
    </button>
  </form>

  <div class="footer-note">
    <span>© <span id="year"></span> MY DRYBEA Seafood Market — All Rights Reserved</span>
    <div class="badges">
      <span>🛡️ SHA-256 Verified</span>
      <span>🌐 Authorized Personnel Only</span>
    </div>
  </div>
</div>

<div class="lock-screen" id="lockScreen" style="display:none;">
  <div class="big-lock">🔓</div>
  <p>ACCESS GRANTED — LOADING DASHBOARD…</p>
</div>

<script>
(function(){
  // ---- Config ----
  const SESSION_KEY = 'mydrybea_session_v1';
  const SESSION_HOURS_REMEMBER = 720;   // 30 days when "keep me signed in" checked
  const SESSION_HOURS_DEFAULT = 8;      // 8 hours otherwise
  const MAX_ATTEMPTS = 5;
  const LOCKOUT_MINUTES = 2;
  const ATTEMPTS_KEY = 'mydrybea_login_attempts';
  // Credential is never stored in plaintext — only a salted SHA-256 hash is compared.
  const CRED_HASH = 'fa46bb6a18578d0aaec8381fa081745df1f9938007e3d7580f01f5d2517addab';
  const SALT = 'mydrybea_salt_2026';
  const REDIRECT_TO = 'index.html';

  const $ = id => document.getElementById(id);
  const form = $('loginForm');
  const alertBox = $('alertBox');
  const alertText = $('alertText');
  const loginBtn = $('loginBtn');
  const spinner = $('spinner');
  const btnText = $('loginBtnText');
  const eyeBtn = $('eyeBtn');
  const pwField = $('password');

  $('year').textContent = new Date().getFullYear();

  // If already unlocked & session valid, skip straight to app
  const existing = getSession();
  if (existing && existing.expires > Date.now()) {
    goToApp(true);
  }

  eyeBtn.addEventListener('click', () => {
    const show = pwField.type === 'password';
    pwField.type = show ? 'text' : 'password';
    eyeBtn.textContent = show ? '🙈' : '👁️';
  });

  function getAttempts(){
    try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY)) || { count:0, lockedUntil:0 }; }
    catch(e){ return { count:0, lockedUntil:0 }; }
  }
  function setAttempts(obj){ localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(obj)); }

  function getSession(){
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
    catch(e){ return null; }
  }

  function showAlert(msg){
    alertText.textContent = msg;
    alertBox.classList.add('show');
  }
  function hideAlert(){ alertBox.classList.remove('show'); }

  async function sha256Hex(str){
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function goToApp(instant){
    if (instant) {
      window.location.replace(REDIRECT_TO);
      return;
    }
    $('lockScreen').style.display = 'flex';
    setTimeout(() => { window.location.replace(REDIRECT_TO); }, 550);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const attempts = getAttempts();
    if (attempts.lockedUntil && attempts.lockedUntil > Date.now()) {
      const mins = Math.ceil((attempts.lockedUntil - Date.now()) / 60000);
      showAlert(`Too many failed attempts. Try again in ${mins} minute(s).`);
      return;
    }

    const email = $('email').value.trim().toLowerCase();
    const password = pwField.value;
    if (!email || !password) return;

    loginBtn.disabled = true;
    spinner.style.display = 'inline-block';
    btnText.textContent = 'Verifying…';

    const hash = await sha256Hex(`${email}:${password}:${SALT}`);
    await new Promise(r => setTimeout(r, 400)); // brief verify delay for UX

    if (hash === CRED_HASH) {
      setAttempts({ count:0, lockedUntil:0 });
      const remember = $('remember').checked;
      const hours = remember ? SESSION_HOURS_REMEMBER : SESSION_HOURS_DEFAULT;
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        user: email,
        expires: Date.now() + hours * 60 * 60 * 1000
      }));
      btnText.textContent = 'Access Granted ✓';
      goToApp(false);
    } else {
      const count = attempts.count + 1;
      if (count >= MAX_ATTEMPTS) {
        setAttempts({ count:0, lockedUntil: Date.now() + LOCKOUT_MINUTES * 60000 });
        showAlert(`Too many failed attempts. Locked for ${LOCKOUT_MINUTES} minutes.`);
      } else {
        setAttempts({ count, lockedUntil:0 });
        showAlert(`Invalid email or password. ${MAX_ATTEMPTS - count} attempt(s) remaining.`);
      }
      loginBtn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = '🔐 Access Dashboard';
    }
  });
})();
</script>

</body>
</html>
