<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login | MY DRYBEA</title>
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#040d0a;--card:#0d1e18;--elev:#18352b;--green:#10b981;--deep:#059669;
  --gold:#d4af37;--text:#f0fdf4;--muted:#6ee7b7;--bad:#f87171;
  --font:'Inter','Noto Sans Sinhala',sans-serif;--display:'Playfair Display',Georgia,serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:radial-gradient(circle at 50% 20%,#12362a 0,#040d0a 55%);
color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:linear-gradient(135deg,var(--card),var(--elev));
border:1.5px solid rgba(16,185,129,.35);border-top:3px solid #a3e635;border-radius:18px;
box-shadow:0 20px 60px #0009;padding:34px 28px}
.logo{width:76px;height:76px;margin:0 auto 14px;display:block;border-radius:17px;border:2px solid var(--gold);object-fit:cover}
h1{text-align:center;font-family:var(--display);font-size:1.55rem;color:#39d39a;letter-spacing:.04em}
.sub{text-align:center;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:7px 0 22px}
.badge{width:max-content;margin:0 auto 24px;padding:7px 14px;border:1px solid #d4af3766;border-radius:999px;
color:#f5e7a3;font-size:11px;font-weight:700;background:#d4af3710}
label{display:block;font-size:12.5px;color:#d1fae5;font-weight:700;margin:0 0 7px}
input{width:100%;height:46px;background:#04150f;border:1.5px solid #10b98133;border-radius:10px;
padding:0 14px;color:var(--text);font:500 14px var(--font);margin-bottom:17px}
input:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px #10b98118}
button{width:100%;height:48px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--deep));
color:#03140d;font-size:14.5px;font-weight:900;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.status,.error{display:none;border-radius:10px;padding:11px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.45}
.status.show{display:block;background:#10b98112;border:1px solid #10b98140;color:#a7f3d0}
.error.show{display:block;background:#f8717115;border:1px solid #f8717159;color:#fecaca}
.footer{text-align:center;margin-top:19px;color:var(--muted);font-size:11px;opacity:.75}
.security{text-align:center;margin-top:9px;color:#94a3a0;font-size:10px}
</style>
</head>
<body>
<main class="card">
  <img src="logo.jpg" class="logo" alt="MY DRYBEA"
       onerror="this.onerror=null;this.src='https://kommodo.ai/i/7zQwNJ1aSv6KnXu59Okw'">
  <h1>MY DRYBEA</h1>
  <p class="sub">Enterprise Umbalakada Management System</p>
  <div class="badge">🔐 Secure Business Access Portal</div>

  <div id="statusBox" class="status" role="status"></div>
  <div id="errBox" class="error" role="alert"></div>

  <form id="loginForm" novalidate>
    <label for="email">Business Email</label>
    <input type="email" id="email" name="email" required autocomplete="username"
           placeholder="name@business.com" spellcheck="false">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password"
           placeholder="Enter your password">

    <button type="submit" id="loginBtn">🔐 Access Dashboard</button>
  </form>

  <div class="footer">© <span id="year"></span> MY DRYBEA Seafood Market — All Rights Reserved</div>
  <div class="security">🛡️ Supabase Auth · Authorized Personnel Only</div>
</main>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://dztuyfiiyxllnvciunjv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6dHV5ZmlpeXhsbG52Y2l1bmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDg3NjUsImV4cCI6MjEwMzU4NDc2NX0.NT5_fvlwZZr_MQMgerYaIZYHeeJ9l9SrConqcN50M84';
  // The anon/publishable key is intended for browser use. Never put a service_role key here.

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storageKey: 'my-drybea-auth'
    }
  });

  const $ = id => document.getElementById(id);
  $('year').textContent = new Date().getFullYear();

  function showError(message) {
    $('statusBox').classList.remove('show');
    $('errBox').textContent = message;
    $('errBox').classList.add('show');
  }
  function showStatus(message) {
    $('errBox').classList.remove('show');
    $('statusBox').textContent = message;
    $('statusBox').classList.add('show');
  }

  // If a valid Supabase session already exists, go to the app.
  (async () => {
    try {
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      if (data.session) window.location.replace('index.html');
    } catch (err) {
      showError('Supabase connection error. Check your Supabase URL/key and internet connection.');
      console.error(err);
    }
  })();

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = $('email').value.trim().toLowerCase();
    const password = $('password').value;
    const btn = $('loginBtn');

    $('errBox').classList.remove('show');
    $('statusBox').classList.remove('show');

    if (!email || !password) {
      showError('Please enter both your business email and password.');
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Signing in…';

    try {
      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        // Friendly messages without exposing unnecessary backend details.
        const msg = (error.message || '').toLowerCase();
        if (msg.includes('invalid login credentials')) {
          showError('Invalid email or password. Make sure the user exists in Supabase Authentication → Users and the password is correct.');
        } else if (msg.includes('email not confirmed')) {
          showError('This email has not been confirmed yet. Confirm the user in Supabase Authentication, then try again.');
        } else {
          showError(error.message || 'Login failed. Please try again.');
        }
        return;
      }

      if (!data.session) {
        showError('Login succeeded but no session was returned. Please try again.');
        return;
      }

      showStatus('Login successful. Opening dashboard…');
      window.location.replace('index.html');
    } catch (err) {
      console.error(err);
      showError('Could not connect to Supabase. Check your internet connection and Supabase project settings.');
    } finally {
      btn.disabled = false;
      btn.textContent = '🔐 Access Dashboard';
    }
  });

  // Keep auth state in sync.
  client.auth.onAuthStateChange((event, session) => {
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
      // Do not redirect during an active form submission twice.
    }
  });
})();
</script>
</body>
</html>
